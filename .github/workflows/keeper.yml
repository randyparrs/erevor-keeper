name: Erevor Keeper

# One keeper pass per 5 minute UTC boundary on Arbitrum Sepolia (chain 421614).
#
# Timing: executeBoundary must land within bufferSeconds (30 s) after each boundary and a runner needs 30 to 90 s to
# start, so the job is triggered about 2 minutes BEFORE each boundary (minutes 3, 8, 13, ...). `--once` opens the
# Pyth Hermes stream shortly before the boundary, captures the first update of each asset, executes and exits. A
# runner that arrives late but inside the window executes immediately.
#
# Trigger: an external cron-job.org job calls the workflow_dispatch API at minutes 3,8,...,58. GitHub's own schedule
# stays as a best effort backup; a late or duplicated run is harmless (the contract skips executed boundaries).
#
# A pass that logs any error (MISSED_WITH_BETS, PYTH_KEY_INVALID_OR_EXPIRED, a missed boundary) exits with code 1,
# so the run fails and GitHub notifies by email.
#
# Cost: free and unlimited minutes on a public repository.

on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'

# A single group: two passes never run in parallel, a new trigger waits for the running one.
concurrency:
  group: erevor-keeper-arbitrum-sepolia
  cancel-in-progress: false

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 9

    steps:
      - name: Record runner start
        run: echo "RUNNER_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js with npm cache
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Run keeper for the next boundary
        run: node dist/src/index.js --once
        env:
          RPC_URL: https://sepolia-rollup.arbitrum.io/rpc
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          PYTH_API_KEY: ${{ secrets.PYTH_API_KEY }}
          CHAIN_ID: '421614'
          MARKET_ADDRESS: '0x0008917F984e12142a48eE3133e2153B30BCBC63'
          LENS_ADDRESS: '0x6C097F874C815B8Da7EeF1c4B07f1E1D282eDcbA'
          HERMES_URL: https://hermes.pyth.network
          MIN_BALANCE: '0.005'
          IDLE_MODE: 'true'
          IDLE_REFRESH_SECONDS: '1800'
          TRIGGER_LEAD_SECONDS: '120'
          LOG_LEVEL: info
