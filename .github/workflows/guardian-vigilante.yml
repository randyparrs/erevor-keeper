name: Erevor Guardian Vigilante

# Runs right after each 5 minute boundary. It compares the lock and close prices of every round closed with bets on
# both sides against the median of the exchange sources (the guardian rule) and opens a dispute from its own wallet
# when the rule says VOID, inside the 300 second dispute window. As the vetoer, with a separate key, it checks every
# pending VOID on GuardianReceiver against the FINALIZED review on GenLayer and vetoes any VOID that the review does
# not back; a veto fails the run so GitHub notifies. Triggered by cron-job.org at minutes 0,5,...,55 plus 20 seconds
# (workflow_dispatch), with GitHub's schedule as backup.

on:
  workflow_dispatch:
  schedule:
    - cron: '1-56/5 * * * *'

concurrency:
  group: erevor-guardian-vigilante
  cancel-in-progress: false

jobs:
  vigilante:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build
      - name: Check closes and pending VOID verdicts
        run: node dist/src/guardian/index.js vigilante
        env:
          RPC_URL: https://sepolia-rollup.arbitrum.io/rpc
          CHAIN_ID: '421614'
          MARKET_ADDRESS: '0x0008917F984e12142a48eE3133e2153B30BCBC63'
          LENS_ADDRESS: '0x6C097F874C815B8Da7EeF1c4B07f1E1D282eDcbA'
          RECEIVER_ADDRESS: ${{ vars.GUARDIAN_RECEIVER_ADDRESS }}
          GUARDIAN_GL_ADDRESS: ${{ vars.GUARDIAN_GL_ADDRESS }}
          GL_NODE: https://rpc-bradbury.genlayer.com
          VIGILANTE_PRIVATE_KEY: ${{ secrets.VIGILANTE_PRIVATE_KEY }}
          VETOER_PRIVATE_KEY: ${{ secrets.VETOER_PRIVATE_KEY }}
          LOOKBACK_MINUTES: '10'
