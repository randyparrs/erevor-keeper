# erevor-vetoer (README.md). Secrets, never in this file:
#   wrangler secret put VETOER_PRIVATE_KEY   GuardianReceiver's vetoer key
#   wrangler secret put ARB_RPC_URL          Arbitrum Sepolia RPC of this Worker
#   wrangler secret put GL_NODE              GenLayer Bradbury node of this Worker
name = "erevor-vetoer"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[vars]
CHAIN_ID = "421614"
RECEIVER_ADDRESS = "0xb2b8E4C75683444B9B97FE1f5375dABFCeE0bb0E"
LENS_ADDRESS = "0x6C097F874C815B8Da7EeF1c4B07f1E1D282eDcbA"
GUARDIAN_GL_ADDRESS = "0xeA701B5d7aF7fADc49C06D0595C7a9557614fDAe"
VETOER_ADDRESS = "0x663ECd2d4dD23AfeE53B783f98Bee6fDd06B4195"
LOOKBACK_MINUTES = "390"

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "HEALTH"
id = "da602f5589d14e5393ee23773496e10a"

[observability]
enabled = true
